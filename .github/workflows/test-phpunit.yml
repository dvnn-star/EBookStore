name: PHPUnit Cross-Platform

on: [push, pull_request]

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - DB ${{ matrix.db }}
    # Menggunakan matrix untuk OS
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['7.4', '8.0', '8.1'] # Saya pangkas versi purba agar efisien
        db: ['pdo_sqlite']
        include:
          # MySQL hanya dijalankan di Linux karena butuh Docker Service
          - os: ubuntu-latest
            php: '8.1'
            db: 'pdo_mysql'

    # Service hanya aktif jika OS adalah Linux
    services:
      mysql:
        image: ${{ matrix.db == 'pdo_mysql' && 'mysql:5.7' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: ci_test
        ports:
          - 3306:3306

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo, pdo_mysql, pdo_sqlite, mbstring, xml
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPUnit Tests
        # Perintah ini akan berjalan baik di PowerShell (Windows) maupun Bash (Linux)
        run: vendor/bin/phpunit --configuration tests/travis/${{ matrix.db }}.phpunit.xml
        env:
          DB_TYPE: ${{ matrix.db }}